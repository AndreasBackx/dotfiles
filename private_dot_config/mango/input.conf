# Keyboard
repeat_rate=40
repeat_delay=300
xkb_rules_layout=us
xkb_rules_options=compose:ralt

# Pointer and trackpad defaults, adapted from the Hyprland input config.
mouse_accel_profile=2
mouse_accel_speed=0.0
trackpad_natural_scrolling=1
trackpad_scroll_factor=0.50
trackpad_accel_profile=2
trackpad_accel_speed=0.25
tap_to_click=1
tap_and_drag=1
drag_tile_to_tile=1
disable_while_typing=1
middle_button_emulation=0
