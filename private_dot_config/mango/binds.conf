##! Applications
bind=SUPER,Return,spawn_shell,ghostty || kitty-cwd || kitty
bind=SUPER,space,spawn,dms ipc call spotlight toggle
bind=SUPER,v,spawn,dms ipc call clipboard toggle
bind=SUPER,m,spawn,dms ipc call processlist focusOrToggle
bind=SUPER,comma,spawn,dms ipc call settings focusOrToggle
bind=SUPER,n,spawn,dms ipc call notifications toggle
bind=SUPER,y,spawn,dms ipc call dankdash wallpaper
bind=SUPER+SHIFT,slash,spawn,dms ipc call keybinds toggle mangowc
bind=SUPER+CTRL,space,spawn,emoji
bind=SUPER,a,spawn,rofai
bind=SUPER,c,spawn_shell,rofi -show calc -modi calc -no-show-match -no-sort
bind=SUPER,o,spawn,ottolangy
bind=CTRL+SHIFT,space,spawn,1password --quick-access

##! Screenshots
bind=SUPER+SHIFT,s,spawn,screenshot
bind=SUPER+CTRL+SHIFT,s,spawn,dms screenshot all --no-file

##! Scratchpads
bind=SUPER,grave,toggle_named_scratchpad,mango-scratch-terminal,none,ghostty --class=mango-scratch-terminal
bind=SUPER,e,toggle_named_scratchpad,mango-scratch-files,none,kitty --class mango-scratch-files -e yazi

##! Session
bind=SUPER+ALT,l,spawn,dms ipc call lock lock
bind=SUPER+SHIFT,e,spawn,dms ipc call powermenu toggle
bind=SUPER+SHIFT,o,spawn,monitor-profiles selection
bind=SUPER+SHIFT,c,spawn,upload
bind=SUPER+ALT,d,spawn_shell,printf start > ~/.config/hyprwhspr/recording_control
bindr=SUPER+ALT,d,spawn_shell,printf stop > ~/.config/hyprwhspr/recording_control

##! Window Management
bind=SUPER,q,killclient
bind=SUPER+SHIFT,q,killclient,force
bind=SUPER+SHIFT,m,quit
bind=SUPER,f,togglefloating
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,p,toggleglobal
bind=SUPER+SHIFT,p,toggleoverlay
bind=SUPER+CTRL,f,togglefakefullscreen
bind=SUPER+CTRL,m,togglemaximizescreen

##! Focus
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,j,exchange_client,down
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,l,exchange_client,right
bind=SUPER+ALT,h,focusmon,left
bind=SUPER+ALT,j,focusmon,down
bind=SUPER+ALT,k,focusmon,up
bind=SUPER+ALT,l,focusmon,right
bind=SUPER+ALT+SHIFT,h,tagmon,left,1
bind=SUPER+ALT+SHIFT,j,tagmon,down,1
bind=SUPER+ALT+SHIFT,k,tagmon,up,1
bind=SUPER+ALT+SHIFT,l,tagmon,right,1

##! Tags
bind=SUPER,left,viewtoleft_have_client
bind=SUPER,right,viewtoright_have_client
bind=SUPER+SHIFT,left,tagtoleft
bind=SUPER+SHIFT,right,tagtoright
bind=SUPER,Tab,toggleoverview
bind=SUPER+SHIFT,Tab,toggleoverview
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9
bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9

##! Layout
bind=SUPER,s,spawn,mango-layout scroller
bind=SUPER,t,spawn,mango-layout dwindle
bind=SUPER+SHIFT,t,spawn,mango-layout tile
bind=SUPER,w,spawn,mango-layout monocle
bind=SUPER,r,switch_layout
bind=SUPER,minus,setmfact,-0.05
bind=SUPER,equal,setmfact,+0.05
bind=SUPER+SHIFT,minus,incgaps,-2
bind=SUPER+SHIFT,equal,incgaps,+2
bind=SUPER+CTRL,g,togglegaps

##! Media
bindl=NONE,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 3
bindl=NONE,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 3
bindl=NONE,XF86AudioMute,spawn,dms ipc call audio mute
bindl=NONE,XF86AudioMicMute,spawn,dms ipc call audio micmute
bindl=NONE,XF86MonBrightnessUp,spawn,dms ipc call brightness increment 5 ""
bindl=NONE,XF86MonBrightnessDown,spawn,dms ipc call brightness decrement 5 ""
bindl=NONE,XF86AudioPlay,spawn,dms ipc call mpris playPause
bindl=NONE,XF86AudioPause,spawn,dms ipc call mpris playPause
bindl=NONE,XF86AudioPrev,spawn,dms ipc call mpris previous
bindl=NONE,XF86AudioNext,spawn,dms ipc call mpris next

##! Mouse And Gestures
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview
