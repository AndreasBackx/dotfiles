# Semantic global tags. These are not monitor-bound workspace ranges.
# 1 main, 2 web, 3 code, 4 chat, 5 media, 6 misc, 7 game, 8 scratch, 9 focus
# Dwindle is the default because it is Mango's closest match to i3/sway's
# recursive split-tree tiling model.

tagrule=id:1,no_hide:1,layout_name:dwindle
tagrule=id:2,no_hide:1,layout_name:dwindle
tagrule=id:3,no_hide:1,layout_name:dwindle
tagrule=id:4,no_hide:1,layout_name:dwindle
tagrule=id:5,no_hide:1,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle

scroller_structs=20
scroller_default_proportion=0.9
scroller_prefer_overspread=1
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_proportion_preset=0.5,0.75,0.9,1.0

new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

dwindle_split_ratio=0.5
dwindle_hsplit=0
dwindle_vsplit=0
dwindle_preserve_split=1
dwindle_smart_split=0
dwindle_smart_resize=1
dwindle_drop_simple_split=1
