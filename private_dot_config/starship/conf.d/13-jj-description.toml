[custom.jj_description]
when = 'command -v jj >/dev/null 2>&1 && jj --ignore-working-copy root >/dev/null 2>&1'
command = '''
description=$(jj --ignore-working-copy log --no-graph -r @ -T 'description.first_line()' 2>/dev/null)
description=$(printf '%s' "$description" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')

if [ -n "$description" ]; then
  printf '%s' "$description" | awk -v len=60 '{ if (length($0) > len) print substr($0, 1, len-3) "..."; else print; }'
else
  jj-starship prompt --no-symbol --no-jj-prefix --no-jj-id --no-jj-status --no-color --bookmarks-display-limit 1 2>/dev/null
fi
'''
style = 'bold purple'
format = '[$output]($style) '
description = 'Jujutsu current change description or ancestor bookmarks'

